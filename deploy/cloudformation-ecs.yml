AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Agent Router Platform - ECS on EC2 deployment (highly available application tier).
  Attaches to an EXISTING VPC (pass VpcId + two public subnets), adds private
  subnets across two AZs, an internet-facing ALB, an ECS cluster backed by an
  Auto Scaling group of container instances (c6g.large / Graviton by default, one
  per AZ), RDS PostgreSQL and ElastiCache Redis.

  Unlike the single-EC2 template, losing one AZ, one instance or one task does not
  take the platform down: ECS reschedules onto the surviving instance, the ASG
  replaces the dead one, and the ALB stops routing to unhealthy targets.

  The application itself is stateless — it writes nothing to local disk — so the
  only state that had to move off the box is PostgreSQL (authoritative) and Redis
  (a rebuildable real-time quota counter / model-list cache).

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  # ---- Existing network to attach to ----
  # The template deliberately does NOT create a VPC: accounts commonly sit at the
  # 5-VPC default limit, and a router that has to wait on a quota increase to
  # deploy is a bad tradeoff. Reusing a VPC also keeps this stack in the same
  # network as anything it must reach privately.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC to deploy into.

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Exactly two EXISTING public subnets in different AZs (they host the ALB and
      the NAT gateway). They must have a default route to an internet gateway.

  PrivateSubnetACidr:
    Type: String
    Default: 10.20.32.0/20
    Description: CIDR for the new private subnet in AZ #1. Must be free inside the VPC's range.

  PrivateSubnetBCidr:
    Type: String
    Default: 10.20.48.0/20
    Description: CIDR for the new private subnet in AZ #2. Must be free inside the VPC's range.

  BackendImage:
    Type: String
    Description: >
      Full ECR image URI for the backend, e.g.
      <acct>.dkr.ecr.us-east-1.amazonaws.com/agent-router-platform-backend:<tag>.
      Use an immutable tag (not :latest) so a service update is reproducible.

  FrontendImage:
    Type: String
    Description: Full ECR image URI for the frontend nginx image.

  DesiredCount:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: >
      Number of tasks. Keep >= 2 for availability: with 1 task there is nothing to
      fail over to, which defeats the purpose of this template. Bounded by ENI
      capacity — see the InstanceType note.

  InstanceType:
    Type: String
    Default: c6g.large
    Description: >
      EC2 instance type for the container instances. c6g.large is Graviton
      (arm64) — the container images MUST be built for arm64 or the tasks will
      fail to start. Switch to an x86 type (e.g. c6i.large) if your images are
      amd64, and set InstanceArchitecture to match.

  InstanceArchitecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: >
      Must match InstanceType's architecture AND the pushed images. It selects
      both the ECS-optimized AMI and the task definition's CpuArchitecture.

  EcsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2/arm64/recommended/image_id
    Description: >
      ECS-optimized AMI, resolved from the SSM public parameter store so a fresh
      instance always gets the current patched image. MUST match
      InstanceArchitecture — for x86_64 use
      /aws/service/ecs/optimized-ami/amazon-linux-2/recommended/image_id.

  ClusterSize:
    Type: Number
    Default: 3
    MinValue: 2
    MaxValue: 6
    Description: >
      Number of container instances (ASG desired = min = max). Should be
      DesiredCount + 1: tasks are pinned one-per-instance (distinctInstance), so
      the extra instance is the headroom a rolling deploy or an AZ rebalance needs
      to start a replacement task before draining the old one. With
      DesiredCount 2 that means 3 instances, of which one is idle at steady state.

  TaskCpu:
    Type: Number
    Default: 1536
    Description: >
      CPU units RESERVED per task (1024 = 1 vCPU). Under the EC2 launch type this
      is a scheduling reservation against the instance's capacity, not a hard cap
      on bursting. c6g.large registers 2048 units; 1536 leaves headroom for the
      ECS agent while still guaranteeing the task most of the box, since
      distinctInstance already gives it the instance to itself.

  TaskMemory:
    Type: Number
    Default: 3072
    Description: >
      Hard memory limit per task (MiB), shared by both containers. Must fit the
      instance: c6g.large registers ~3906 MiB after the agent's overhead, so 3072
      fits with margin. A task exceeding this is killed, so do not set it to the
      full registered amount.

  # ---- Data tier ----
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: RDS instance class. db.t4g.micro is enough for this workload's config/log traffic.

  DbMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      RDS Multi-AZ. "false" (default) keeps cost down and still has automated
      backups with minute-scale recovery; set "true" for automatic failover.

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    Description: RDS storage (GiB). gp3, autoscaling up to 5x via MaxAllocatedStorage.

  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
    Description: ElastiCache node type for Redis.

  # ---- Application secrets (REQUIRED) ----
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Secret that signs admin JWTs (HS256). Long random string.

  SecretKey:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >
      AES-GCM key that encrypts upstream channel credentials at rest. CRITICAL:
      if you are migrating an existing database, this MUST be the same value the
      old deployment used, or every stored channel key becomes undecryptable.

  PostgresPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    AllowedPattern: '[a-zA-Z0-9!#$%&()*+,\-.:;<=>?\[\]^_{|}~]*'
    Description: RDS master password (RDS forbids '/', '@', '"' and spaces).

  AdminUsername:
    Type: String
    Default: ""
    Description: Optional bootstrap admin username (seeded on first start if both admin params are set).

  AdminPassword:
    Type: String
    Default: ""
    NoEcho: true
    Description: Optional bootstrap admin password.

  # ---- Networking / TLS ----
  CertificateArn:
    Type: String
    Default: ""
    Description: >
      Optional ACM certificate ARN. When set, the ALB listens on HTTPS :443 and
      redirects :80 to it. When blank, only plain HTTP :80 is served (fine for a
      *.elb.amazonaws.com smoke test, not for production traffic).

  AlbIdleTimeout:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 4000
    Description: >
      ALB idle timeout in seconds. MUST comfortably exceed the longest streaming
      response: /v1/* replies are SSE and a slow model can think for minutes.
      The 60s default would cut long answers off mid-stream.

  LogRetentionDays:
    Type: Number
    Default: 14
    Description: CloudWatch Logs retention for container logs.

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  NoCertificate: !Equals [!Ref CertificateArn, ""]
  IsDbMultiAZ: !Equals [!Ref DbMultiAZ, "true"]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ======================= Networking =======================
  # VPC, internet gateway and public subnets are pre-existing (passed in as
  # parameters). Only the private tier is created here.

  # ---- Private subnets (container instances, tasks, RDS, Redis) ----
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref PrivateSubnetACidr
      # Pin each private subnet to the same AZ as the public subnet it shares an
      # index with, so the NAT gateway (public A) and the tasks that route
      # through it stay in one AZ, and RDS/Redis land in the same two AZs as the
      # tasks that talk to them.
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-b"

  # ---- NAT: private tasks need outbound access to Bedrock / upstream gateways
  # and to the SageMaker probe endpoint. One NAT gateway (in AZ a) is a cost/HA
  # tradeoff: if AZ a dies, tasks in AZ b lose egress. Add a second NAT per AZ if
  # that matters more than ~$32/month.
  NatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Select [0, !Ref PublicSubnetIds]
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-nat"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-private-rt"

  DefaultPrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ======================= Security groups =======================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - public HTTP/HTTPS ingress
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP (redirected to HTTPS when a certificate is set)
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-alb-sg"

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks (awsvpc ENIs) - only the ALB may reach the frontend port
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-task-sg"

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: frontend nginx, ALB only

  # Container instances themselves. They never receive traffic directly (the ALB
  # targets the tasks' own ENIs under awsvpc), so this group has no ingress at all
  # — only the implicit all-egress needed to pull images and reach ECS.
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS container instances - no inbound; egress only
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-instance-sg"

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL - reachable only from the ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: postgres from tasks
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis - reachable only from the ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref TaskSecurityGroup
          Description: redis from tasks
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-cache-sg"

  # ======================= Data tier =======================
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} private subnets"
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  Database:
    Type: AWS::RDS::DBInstance
    # Keep the data if the stack is deleted — the whole point of moving Postgres
    # off the instance was that the data outlives the compute.
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-db"
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref DbAllocatedStorage
      MaxAllocatedStorage: !Ref DbAllocatedStorage  # set higher to allow storage autoscaling
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: postgres
      MasterUserPassword: !Ref PostgresPassword
      DBName: agent_router
      MultiAZ: !If [IsDbMultiAZ, true, false]
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref DbSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      EnablePerformanceInsights: false
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db"

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: !Sub "${AWS::StackName} private subnets"
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  # Single-node Redis. Redis holds only rebuildable state: the real-time quota
  # counters lazily reseed from the authoritative PostgreSQL used_quota columns,
  # and the channel model-list cache has a 10-minute TTL. Losing this node costs
  # accuracy for seconds, not data.
  Cache:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-redis"
      Engine: redis
      CacheNodeType: !Ref CacheNodeType
      NumCacheNodes: 1
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      VpcSecurityGroupIds:
        - !Ref CacheSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-redis"

  # ======================= Load balancer =======================
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-alb"
      Scheme: internet-facing
      Type: application
      SecurityGroups:
        - !Ref AlbSecurityGroup
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        # Long idle timeout for SSE: /v1/* streams tokens for as long as the
        # model takes, and the ALB must not sever an idle-looking connection.
        - Key: idle_timeout.timeout_seconds
          Value: !Ref AlbIdleTimeout
        - Key: routing.http2.enabled
          Value: "true"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${AWS::StackName}-tg"
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 80
      TargetType: ip           # required by awsvpc networking (task ENIs)
      HealthCheckPath: /api/ping
      HealthCheckProtocol: HTTP
      # Tuned for how fast a target is ejected after an UNGRACEFUL loss (an
      # instance terminating outright, rather than a task draining). A drained
      # task is deregistered by ECS before it dies, but a yanked instance takes
      # its task ENI with it, so the only thing that stops the ALB forwarding into
      # a void is a failed health check. 5s x 2 ejects in ~10s instead of ~45s.
      # Measured: terminating an instance mid-traffic cost 2 failed requests at
      # 15s/3-strikes, and the window shrinks proportionally with these values.
      HealthCheckIntervalSeconds: 5
      HealthCheckTimeoutSeconds: 3
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        # Streaming responses are long-lived; give in-flight SSE connections room
        # to finish on deploy rather than being cut at the 300s default.
        - Key: load_balancing.algorithm.type
          Value: least_outstanding_requests

  # When a certificate is supplied, :80 only redirects to :443.
  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # No certificate: serve plain HTTP so the *.elb.amazonaws.com URL works.
  HttpForwardListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: NoCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ======================= ECS =======================
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: !Ref LogRetentionDays

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ======================= EC2 capacity =======================
  # The instances that actually run the tasks. Compared with Fargate this trades
  # "no servers to manage" for cheaper sustained capacity and a specific instance
  # type — but the availability story is unchanged: tasks are spread across two
  # AZs, ECS reschedules onto the survivor, and the ASG replaces a lost instance.

  # Lets the ECS agent register the instance with the cluster and pull from ECR.
  # SSM access is included so the box can be debugged without opening SSH.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${AWS::StackName}-lt"
      LaunchTemplateData:
        ImageId: !Ref EcsAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile:
          Arn: !GetAtt InstanceProfile.Arn
        SecurityGroupIds:
          - !Ref InstanceSecurityGroup
        MetadataOptions:
          HttpTokens: required          # IMDSv2 only
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 30
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        # The ECS agent reads the cluster name from this file at boot; without it
        # the instance registers with the "default" cluster and the service can
        # never place a task.
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo "ECS_CLUSTER=${Cluster}" >> /etc/ecs/ecs.config
            echo "ECS_ENABLE_CONTAINER_METADATA=true" >> /etc/ecs/ecs.config
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "${AWS::StackName}-container-instance"

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "${AWS::StackName}-asg"
      MinSize: !Ref ClusterSize
      MaxSize: !Ref ClusterSize
      DesiredCapacity: !Ref ClusterSize
      # Private subnets: the instances pull images out through the NAT gateway and
      # are not reachable from the internet.
      VPCZoneIdentifier:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      HealthCheckType: EC2
      HealthCheckGracePeriod: 120
      # Keep capacity balanced across AZs so losing one AZ costs half the
      # capacity, not all of it.
      AvailabilityZoneDistribution:
        CapacityDistributionStrategy: balanced-best-effort
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-container-instance"
          PropagateAtLaunch: true
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT5M

  # Ties the ASG to the cluster. Managed scaling is off because MinSize == MaxSize
  # (a fixed-size cluster); managed termination protection is off so the ASG can
  # freely replace an unhealthy instance.
  CapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      Name: !Sub "${AWS::StackName}-cp"
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref AutoScalingGroup
        ManagedScaling:
          Status: DISABLED
        ManagedTerminationProtection: DISABLED

  ClusterCapacityProviderAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders:
        - !Ref CapacityProvider
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
          Base: 0

  # Pulls images and writes logs (used by the task, not the instance).
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # The application's own identity. Deliberately EMPTY of AWS permissions: the
  # relay authenticates to Bedrock with per-channel bearer keys stored (encrypted)
  # in the database, so it needs no SigV4 and no IAM access. Keeping this role
  # bare means a compromised container cannot reach the AWS control plane.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}"
      RequiresCompatibilities: [EC2]
      # awsvpc is kept (rather than bridge) so each task gets its own ENI and its
      # own security group, and so the ALB can target task IPs directly. Note the
      # ENI budget: c6g.large allows 3 ENIs, one of which is the instance's own,
      # so at most 2 tasks fit per instance.
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        # Must match the instance architecture and the pushed images.
        CpuArchitecture: !Ref InstanceArchitecture
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        # ---- backend ----
        # Both containers share the task's network namespace, so the frontend
        # reaches the backend on 127.0.0.1:3000 exactly as it did over the
        # compose network alias.
        - Name: backend
          Image: !Ref BackendImage
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: PORT
              Value: "3000"
            - Name: GIN_MODE
              Value: release
            - Name: POSTGRES_HOST
              Value: !GetAtt Database.Endpoint.Address
            - Name: POSTGRES_PORT
              Value: !GetAtt Database.Endpoint.Port
            - Name: POSTGRES_USER
              Value: postgres
            - Name: POSTGRES_PASSWORD
              Value: !Ref PostgresPassword
            - Name: POSTGRES_DB
              Value: agent_router
            # RDS terminates TLS; require it rather than sending credentials in clear.
            - Name: POSTGRES_SSLMODE
              Value: require
            - Name: REDIS_ADDR
              Value: !Sub "${Cache.RedisEndpoint.Address}:${Cache.RedisEndpoint.Port}"
            - Name: REDIS_PASSWORD
              Value: ""
            - Name: REDIS_DB
              Value: "0"
            - Name: JWT_SECRET
              Value: !Ref JwtSecret
            - Name: SECRET_KEY
              Value: !Ref SecretKey
            - Name: ADMIN_USERNAME
              Value: !Ref AdminUsername
            - Name: ADMIN_PASSWORD
              Value: !Ref AdminPassword
          HealthCheck:
            Command: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/ping || exit 1"]
            Interval: 15
            Timeout: 5
            Retries: 5
            StartPeriod: 60
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend

        # ---- frontend ----
        - Name: frontend
          Image: !Ref FrontendImage
          Essential: true
          PortMappings:
            - ContainerPort: 80
              Protocol: tcp
          Environment:
            # awsvpc mode gives the task ONE network namespace, so there is no
            # "backend" service DNS the way docker-compose provided — the sibling
            # container is only reachable over loopback.
            - Name: BACKEND_ORIGIN
              Value: 127.0.0.1:3000
          DependsOn:
            - ContainerName: backend
              Condition: HEALTHY
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: frontend

  # ECS refuses to attach a service to a target group that no listener references
  # yet, so the service must wait for whichever listener the certificate choice
  # created. DependsOn cannot name a conditional resource (it is not "unresolved"
  # in the other branch — it simply does not exist), so the wait is expressed as a
  # value dependency instead: this parameter reads an attribute of the listener
  # that does exist, which is enough for CloudFormation to order them.
  ListenerReadyBarrier:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/listener-ready"
      Type: String
      Value: !If
        - HasCertificate
        - !Ref HttpsListener
        - !Ref HttpForwardListener
      Description: "Internal ordering barrier: ensures a listener exists before the ECS service attaches."

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - ListenerReadyBarrier
      # Placement fails outright if the capacity provider is not yet attached to
      # the cluster when the service is created.
      - ClusterCapacityProviderAssociation
    Properties:
      ServiceName: !Sub "${AWS::StackName}-svc"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      # EC2 launch type via the capacity provider, rather than LaunchType: EC2
      # directly — the provider is what binds the service to this stack's ASG.
      CapacityProviderStrategy:
        - CapacityProvider: !Ref CapacityProvider
          Weight: 1
          Base: 0
      # HARD requirement, not just a preference: never put two tasks on the same
      # container instance. `spread` alone is advisory — measured behaviour was
      # that after an instance was replaced, ECS packed BOTH tasks onto whichever
      # instance had capacity and then never rebalanced them (availability-zone
      # rebalancing did not move them within 6 minutes). Two tasks on one box
      # means one instance failure takes the whole service, which is the exact
      # thing this template exists to prevent.
      #
      # Consequence: DesiredCount must be <= ClusterSize, and a rolling deploy
      # needs somewhere to put the new task — see MinimumHealthyPercent below.
      PlacementConstraints:
        - Type: distinctInstance
      PlacementStrategies:
        - Type: spread
          Field: attribute:ecs.availability-zone
      DeploymentConfiguration:
        # MaximumPercent MUST stay above 100: ECS rejects the service outright
        # ("Availability Zone Rebalancing does not support maximumPercent <= 100")
        # because rebalancing works by starting a replacement task before
        # draining the old one. That surplus task needs an instance to land on,
        # and distinctInstance forbids doubling up — hence ClusterSize defaults to
        # DesiredCount + 1, leaving one instance free as deployment headroom.
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true             # a bad image rolls itself back
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          # AssignPublicIp is only valid for Fargate; under EC2 the task ENI
          # inherits the instance subnet's routing (private -> NAT).
          Subnets:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: frontend
          ContainerPort: 80
          TargetGroupArn: !Ref TargetGroup

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  Url:
    Description: Public URL of the platform.
    Value: !If
      - HasCertificate
      - !Sub "https://${LoadBalancer.DNSName}"
      - !Sub "http://${LoadBalancer.DNSName}"

  AlbDnsName:
    Description: Raw ALB DNS name (point your CNAME/ALIAS here).
    Value: !GetAtt LoadBalancer.DNSName

  AlbHostedZoneId:
    Description: ALB canonical hosted zone id (for a Route53 ALIAS record).
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID

  DbEndpoint:
    Description: RDS endpoint (private; reachable only from the tasks' security group).
    Value: !GetAtt Database.Endpoint.Address

  RedisEndpoint:
    Description: ElastiCache Redis endpoint (private).
    Value: !GetAtt Cache.RedisEndpoint.Address

  ClusterName:
    Value: !Ref Cluster

  AutoScalingGroupName:
    Description: ASG holding the container instances (scale or cycle them here).
    Value: !Ref AutoScalingGroup

  ServiceName:
    Value: !GetAtt Service.Name

  LogGroupName:
    Description: CloudWatch log group holding backend/frontend container logs.
    Value: !Ref LogGroup
